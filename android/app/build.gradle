plugins { id 'com.android.application' }
android {
    namespace 'org.iskan.mobile'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        applicationId 'org.iskan.mobile'
        minSdk 29
        targetSdk 35
        versionCode 18
        versionName '2.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    buildTypes {
        release { minifyEnabled false }
        preview { initWith debug; applicationIdSuffix '.preview'; versionNameSuffix '-preview'; matchingFallbacks = ['debug'] }
    }
    testBuildType project.hasProperty('screenshotBuild') ? 'preview' : 'debug'
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
    testOptions { animationsDisabled true; unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.5.1'
    implementation 'androidx.camera:camera-lifecycle:1.5.1'
    implementation 'androidx.camera:camera-view:1.5.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.1'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    testImplementation 'junit:junit:4.13.2'
}

